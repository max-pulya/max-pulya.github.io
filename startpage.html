<!DOCTYPE html>
<html><head>
</head><body>
<form id="myForm">
  
  <input type="text" id="myInput" placeholder="Введите URL">
  <button type="submit">Отправить</button>
</form>
<a href="https://m.youtube.com">
  <img src="ytlogo.png" alt="ютуб ссылка" >
</a>

<script>
const form = document.getElementById('myForm'); 
const input = document.getElementById('myInput'); 
form.addEventListener('submit', function(event) { 
    event.preventDefault();  
    let adress=input.value;
    if (!adress.startsWith('http://') && !adress.startsWith('https://')) {
        adress = 'https://' + adress;
    }
window.location.href = adress;
});


</script>
  <h3>Kvazitec Привет от Макса Пули</h3>
  <iframe src="https://www.google.com"></iframe>
</body></html>
